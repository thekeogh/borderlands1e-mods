[project]
name = "Playthrough 3"
version = "2.2.0"
authors = [{ name = "keogh" }]
description = "Adds PT3 with named enemies/bosses fixed at 69, ordinary enemies 69 to 69 + spread, and level-1 cash prices and rewards. Default spread 3. Supports BL1 Enhanced."

[tool.sdkmod]
name = "Playthrough 3"
mod_type = "Standard" # or "Library"
supported_games = ["BL1", "BL1E"]
coop_support = "Unknown"
auto_enable = true
license = {name = "GPL3", url = "https://choosealicense.com/licenses/gpl-3.0/" }
