[project]
name = "Playthrough 3"
version = "3.0.1"
authors = [{ name = "keogh" }]
description = "A resettable third playthrough with level-1 cash prices, enemies 71–74 and named bosses at 71. Enemy Max Level: 3–5, default 5. Full preset table in the in-game description."

[tool.sdkmod]
name = "Playthrough 3"
mod_type = "Standard" # or "Library"
supported_games = ["BL1", "BL1E"]
coop_support = "Unknown"
auto_enable = true
license = {name = "GPL3", url = "https://choosealicense.com/licenses/gpl-3.0/" }
