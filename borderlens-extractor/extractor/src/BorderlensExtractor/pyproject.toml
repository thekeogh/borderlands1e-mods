[project]
name = "BorderlensExtractor"
version = "0.3.2"
authors = [{ name = "keogh" }]
description = "Game-data and catalogue-seed exporter for Borderlens: equipment, characters, missions, skills and installed English names. Load a solo character, close menus and press F9. Exports: sdk_mods/settings/BorderlensExtractor/."

[tool.sdkmod]
name = "Borderlens Extractor"
mod_type = "Standard"
supported_games = ["BL1E"]
coop_support = "Incompatible"
auto_enable = true
