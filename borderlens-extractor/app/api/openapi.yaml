openapi: 3.0.3
info:
  title: Borderlens local workshop
  version: 0.52.3
  description: Local-only catalogue processing. Disk-backed checkpoints; no hosted accounts or API-key billing.
servers:
  - url: http://127.0.0.1:4317
paths:
  /api/project-backup/export:
    post:
      operationId: exportCompleteProject
      description: Export a complete saved project ZIP, named YYYY-MM-DD_HH-mm.zip in local time. Requires processing fully paused/idle. Includes a standalone SQLite VACUUM snapshot (committed WAL included), all data sidecars, extraction archives, source HTML/manual text, drafts/output/history, AI caches and image library. Browser layout supplied in the body is included. Does not change project data or start work. Not the player catalogue export.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [selection, groups, tab, view, query, filter]
              properties:
                selection: { type: string, maxLength: 500 }
                groups:
                  { type: object, additionalProperties: { type: boolean } }
                tab:
                  {
                    type: string,
                    enum: [preview, game-data, sources, history, json],
                  }
                view: { type: string, enum: [catalogue, coverage, activity] }
                query: { type: string, maxLength: 1000 }
                filter: { type: string, maxLength: 100 }
      responses:
        "200":
          description: Full project ZIP with backup.json inventory and SHA-256 checksums; Content-Disposition supplies the timestamped filename.
          content:
            { application/zip: { schema: { type: string, format: binary } } }
        "400":
          { description: Invalid browser layout or unsupported project files. }
        "409":
          {
            description: Pause all processing and wait for the current step first.,
          }
        "413": { description: Project exceeds the backup size limit. }
  /api/project-backup/import:
    post:
      operationId: importCompleteProject
      description: Restore a complete Borderlens project ZIP (not a game extraction or standalone SQLite). Requires fully paused/idle work. Validate paths, size limits, inventory, hashes, database integrity, evidence/capture dependencies and overrides before touching the current project. Atomically replace data, reopen the same Store without startup migrations, retain the previous project as a recovery copy and roll back on installation failure. Restore images into the project image-library. No queue/model calls or automatic Resume; paused checkpoints remain paused. Browser reapplies returned layout then reloads. External CLI login and extension/browser runtime are not included.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [backup]
              properties: { backup: { type: string, format: binary } }
      responses:
        "200":
          {
            description: Restored; returns ok,
            browser ui,
            backup createdAt and recoveryCopy path.,
          }
        "400":
          {
            description: Invalid/incomplete/damaged/unsafe/incompatible archive; current project retained.,
          }
        "409":
          {
            description: Pause all processing and wait for the current step first.,
          }
        "413":
          { description: Upload exceeds 1 GB or expanded backup exceeds 4 GB. }

  /api/shared-sources:
    get:
      operationId: listSharedEvidence
      responses:
        "200":
          description: "Saved global, category and subgroup scopes with their URLs, captured articles, exclusions and affected item counts."
    post:
      operationId: saveSharedEvidence
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope]
              properties:
                scope:
                  type: object
                  required: [category]
                  properties:
                    category:
                      type: string
                      description: Everything applies to the entire catalogue; other values scope evidence to one category.
                      enum:
                        [
                          Everything,
                          Weapons,
                          Shields,
                          Grenade mods,
                          Class mods,
                          Artifacts,
                          Other equipment,
                        ]
                    group: { type: string }
                    character: { type: string }
                url: { type: string }
                html: { type: string }
                remove: { type: boolean }
      responses:
        "200":
          {
            description: Saved scope. URL-only binding does not fetch; HTML is cached once and inherited by matching items. Changes invalidate dependent drafts for the next requested build without appending to active or paused queues. Remove detaches the URL from this scope.,
          }
        "400": { description: "Invalid scope, URL or HTML." }
        "409":
          { description: Affected item is currently processing; pause first. }
  /api/evidence/promote:
    post:
      operationId: promoteEvidenceToParent
      description: Move a directly attached website article or saved manual text entry exactly one level up the displayed item/group hierarchy. Saved snapshots keep their IDs and content; matching parent URLs deduplicate. Descendants inherit the article, keeping individual exclusions. Output is retained and dependent drafts are invalidated for the next requested build. Never starts work or appends queue entries. Manual text must be a real owned saved record; arbitrary local IDs are rejected. Shared manual text uses the existing Auto/Always/Never filtering, index cache and per-item exclusions. Its private label is not sent as a factual title; no fetching or build starts. Everything has no parent.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [ownerId, url]
              properties:
                ownerId: { type: string }
                url: { type: string, format: uri }
      responses:
        "200":
          description: Parent scope and name; source no longer directly attached to its former owner.
        "400":
          description: Invalid request, unsupported URL or Everything has no parent.
        "404":
          description: Unknown owner or evidence is not directly attached.
        "409":
          description: Restore removed owner or pause active affected processing first.
  /api/images:
    get:
      operationId: imageCoverage
      responses:
        "200":
          description: Local raster files from safe top-level library folders, per-candidate matches and revision, with matched/missing/ambiguous counts; excludes deliberately excluded candidates. No-store response; rescans files without invoking AI or changing the queue.
  /api/images/file/{folder}/{filename}:
    parameters:
      - { name: folder, in: path, required: true, schema: { type: string } }
      - { name: filename, in: path, required: true, schema: { type: string } }
    get:
      operationId: itemImage
      responses:
        "200":
          description: "Supported local raster image, with no-cache revalidation."
        "404": { description: "Missing, unsupported or unsafe image path." }
  /api/items/{id}/image:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: setItemImage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                image:
                  {
                    type: string,
                    nullable: true,
                    description: Existing category/filename raster image; null explicitly marks no image.,
                  }
                automatic:
                  {
                    type: boolean,
                    description: Clear the saved override and use name matching.,
                  }
      responses:
        "200":
          {
            description: Effective image match; preserves processing state and does not rebuild content.,
          }
        "400": { description: Invalid request or nonexistent image. }
        "404": { description: Item not found. }
  /api/chrome-helper:
    get:
      operationId: chromeHelperSetup
      responses:
        "200":
          {
            description: Local helper version and unpacked extension folder path.,
          }
  /api/chrome-helper/open-extensions:
    post:
      operationId: openChromeExtensions
      responses:
        "200":
          {
            description: Opens the fixed Chrome extensions management page locally.,
          }
        "500":
          {
            description: Chrome could not be opened; UI provides copyable setup URL.,
          }
  /api/chrome-helper/extension.zip:
    get:
      operationId: downloadChromeHelper
      responses:
        "200":
          {
            description: Helper extension source ZIP including the on-page selection script; separate from website catalogue export.,
          }
  /api/chrome-helper/jobs:
    post:
      operationId: prepareChromeCapture
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [familyId, url]
              properties:
                familyId: { type: string }
                url: { type: string }
      responses:
        "200":
          {
            description: Short-lived ticket bound to one item and expected article URL.,
          }
        "400": { description: Invalid source URL. }
        "404": { description: Family missing. }
  /api/chrome-helper/capture:
    post:
      operationId: receiveChromeCapture
      description: Accept ticket-bound sanitized HTML. Extension 1.1.0 can capture only Ctrl-drag selected regions. Bounded HTML meta markers identify selectedContent (boxes 1–30, warnings 0–boxes); selected excerpts may be shorter than full articles. Retain headings/tables where selected. Excerpt metadata stays private in source records/ledgers; missing content is not proof of absence. Selected excerpts stay with their item/promoted scope and survive refresh, excluded from the global complete-page cache. No automatic build.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [jobId, token, url, html]
              properties:
                jobId: { type: string }
                token: { type: string }
                url: { type: string }
                html: { type: string }
      responses:
        "200":
          {
            description: Saved or queued for the next safe worker checkpoint; replay is idempotent.,
          }
        "400":
          { description: Invalid HTML or source URL does not match the ticket. }
        "403": { description: Missing/invalid/expired capture ticket. }
  /api/sources/{id}/html:
    get:
      operationId: readStoredSourceHtml
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      responses:
        "200":
          description: Exact cached HTML as inert text; no source-site fetch or rewriting.
          content:
            text/plain:
              schema: { type: string }
        "404": { description: Source or its cached HTML file no longer exists. }
  /api/state:
    get:
      operationId: getState
      responses:
        "200":
          {
            description: "Queue, families, settings, captures, recent activity and optional evidenceStats (last/current item, timestamped source manifests per actual CLI submission, reading/indexing/writing/verify/repair phases, source mode captured at send time, local response-cache and analysis-cache reuse). Stats persist until the next item; permanent completed/failed snapshots are returned in item evidenceStatsHistory. Source manifests derive from the same final structured values serialized into prompts, not inclusion switches. CLI submission counts exclude cache hits, auth failures and cooldown skips; explicit retries/fallback submissions count again. This measures submitted evidence, not provider token usage or internal retries. No prompt bodies are stored in these stats. Active run messages include build attempt, subprocess elapsed time, time since last output and the bounded timeout; process liveness does not prove service progress. No raw capture blobs.",
          }
  /api/events:
    get:
      operationId: watchState
      responses:
        "200":
          {
            description: "Server-sent revision events; reconnect by fetching state.",
          }
  /api/import:
    post:
      operationId: importCapture
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        "200":
          {
            description: "Verified capture import; identical archive is idempotent.",
          }
        "400":
          {
            description: "Invalid format, checksum, path or archive. Existing data retained.",
          }
        "409": { description: "Pause the worker before changing evidence." }
  /api/items/{id}/game-data:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getImportedGameData
      description: Read-only ZIP snapshot identified from original extracted records. Excludes saved sources, compiled output, user corrections and classification/image overrides. Stable across builds; changes when extraction changes. No model calls or queue/artifact writes.
      responses:
        "200":
          description: Raw family identity; capture names/versions/counts; supported identity facts; root/defining/related records with decoded properties and exact original record objects; extraction warnings. Linked context is bounded and never establishes final roll ranges or part compatibility.
        "404": { description: Family not found in imported game records. }
  /api/items/{id}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: getItem
      responses:
        "200":
          {
            description: "Family with URL-matched catalogue-wide cached pages (reusedFrom identifies a previously saved article; logical item bindings remain independent), inheritedEvidence (URL, title, textBytes as exact stored-text UTF-8 bytes or null when uncaptured; no HTML/metadata/prompt bytes, item-specific inclusionMode (auto/always/never, default auto), legacy alwaysInclude boolean, all contributing parent IDs/names and captured status), active sources plus excludedSources (restorable per-item URL exclusions), nameDecision (private rename proof/result; uncertain names stay unchanged), family.rawName/nameOverride (saved name corrections; IDs and ZIP records unchanged), effective classification override (equipment category and/or weapon subtype; equipment overrides have a null weaponType; verification identifies URL-discovery proof or saved-source verification), facts/evidence, per-provider research status/errors, sources (manualText=true marks pasted excerpts, label kept in title, exact text and private non-fetchable local URL), private researchAudit with full-source chunk readings and fact dispositions, evidenceFollowup (one optional saved-only request round, topics/matches/missing context, blocked-source matches and fallback status), evidenceRequestNotice (persistent private blocked-request alert with id, requestedAt, topic/reason/source title/URL and optional dismissedAt), evidenceStatsHistory (permanent per-item build/sync summaries with timestamp, outcome and exact source manifests for CLI submissions, response-cache hits and saved-analysis reuse; separate from rolling family.history), sharedSourceSelection with kept/skipped tagged-fact decisions and index cache/fallback counts, stage history and last valid output. Final whole-document validation status, image metadata and savedRebuild availability/reason are included for built and unbuilt candidates. Website output is schema 9: item-level dlc (canonical Base Game/expansion or null; extraction identity first, then item-specific sources), no game/series field, canonical element enum, full-document consistency checks, relative image path or null, rich description/details, contextual stat ranges, grouped conditional dropChances and inline parts; empty note strings are omitted; provenance and coverage stay private. Final JSON includes the item revision counter. extractedDlc is read-only origin inferred only from existing family identity-root DLC package records; Preview can use it before any build. Unknown origin stays null, acquisition DLC remains independent, and nonnull item origins require evidence claims. Viewing/exporting does not increment revision. Does not change the queue.",
          }
        "404": { description: "Family not found." }
  /api/items/{id}/action:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: itemAction
      description: "rebuild-saved uses saved pages and matching extracted facts without fetching; missing analysis is read from those saved pages. rebuild-fresh fetches and reads current sources, preserving old pages on failure. Busy rebuilds are deferred with their chosen mode. Legacy rebuild retains its prior behavior. discover starts URL-only processing for this item, preserves a paused build checkpoint and filters inherited article aliases from local URLs/matches. Its existing agent call can verify an exact obtainable BL1 Needs review identity/type and persist a discovery classification, immediately updating navigation and inherited groups without fetching article HTML or building. Build checks those decisions against saved articles again. Raw extraction and existing JSON/revision are retained; changing a classification can invalidate an older build for the next requested rebuild. Pause an active job first."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  {
                    type: string,
                    enum:
                      [
                        rebuild,
                        rebuild-saved,
                        rebuild-fresh,
                        discover,
                        from,
                        refresh,
                        retry,
                        exclude,
                        remove,
                        restore,
                        exclude-source,
                        restore-source,
                        resolve,
                        classification,
                        save-output,
                      ],
                  }
                url: { type: string }
                html: { type: string }
                notes: { type: string }
                sourceId:
                  {
                    type: string,
                    description: Saved/excluded source ID; exclude-source may instead take an existing unsaved evidence URL in url.,
                  }
                gameOnly: { type: boolean }
                output: { type: object }
                weaponType:
                  type: string
                  nullable: true
                  enum:
                    [
                      Combat rifles,
                      Eridian weapons,
                      Repeater pistols,
                      Revolvers,
                      Rocket launchers,
                      Shotguns,
                      SMGs,
                      Sniper rifles,
                      null,
                    ]
      responses:
        "200":
          {
            description: "Action checkpointed. exclude-source/restore-source take sourceId; exclude-source also accepts url for an unsaved item evidence link and creates a restorable exclusion without fetching the page; they invalidate source-dependent drafts, keep HTML, and suppress automatic fetching until restored. Changing the currently processing item requires pause. No model call is started. Remove/exclude hides an item from normal navigation, batches and exports while retaining its data. Restore returns it without starting a build. The currently processing item must be paused before removal; other items can be removed during a batch. Rebuilds queue behind active work; selection never triggers action.",
          }
        "400":
          {
            description: "Invalid action or invalid output; last successful output retained.",
          }
        "404": { description: "Family not found." }
        "409":
          {
            description: "Action requires a paused worker, or saved-source rebuild has no saved pages.",
          }
  /api/items/{id}/name:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: setManualItemName
      description: "Save an authoritative manual display name with permanent priority over research and extraction. No AI, fetching or builds. Updates navigation, Preview, existing JSON/draft/packet names and export slugs while preserving raw identity, aliases, prose, readiness and queues. Persists manual origin in name-overrides.json. AI/Sync name cannot replace it; subsequent manual edits can. Unbuilt items gain no generated JSON."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [name]
              properties:
                name:
                  {
                    type: string,
                    minLength: 1,
                    maxLength: 160,
                    description: Trimmed single-line display name.,
                  }
      responses:
        "200":
          {
            description: "changed boolean and explanatory message; no work queued.",
          }
        "400": { description: Invalid/empty/multiline name or request. }
        "404": { description: Unknown item. }
        "409":
          {
            description: "Active job, removed/retired/shared owner, or saved JSON cannot validate.",
          }
  /api/items/{id}/type:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: setManualItemType
      description: "Set an authoritative manual equipment/weapon type, or null to remove it and restore research/game classification. No AI, fetching or build. Immediately update navigation/inheritance and existing JSON/draft/packet identity metadata, preserving wording, IDs, raw records and queues. Completed validated output remains ready; changed saved JSON increments revision. Persists in classification-overrides.json."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [type]
              properties:
                type:
                  type: string
                  nullable: true
                  enum:
                    [
                      Combat rifles,
                      Eridian weapons,
                      Repeater pistols,
                      Revolvers,
                      Rocket launchers,
                      Shotguns,
                      SMGs,
                      Sniper rifles,
                      Shields,
                      Class mods,
                      Grenade mods,
                      Artifacts,
                      Other equipment,
                      null,
                    ]
                notes: { type: string, maxLength: 10000 }
      responses:
        "200":
          { description: "changed boolean and explanation; no work queued." }
        "400": { description: Invalid type or request. }
        "404": { description: Unknown item. }
        "409":
          {
            description: "Active job, removed/retired/shared owner, or resulting saved JSON cannot validate.",
          }
  /api/items/{id}/sync:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: syncSavedItemIdentity
      description: "Saved-only medium-effort type or name verification. Checks original definitions, allowed individual/inherited evidence and existing JSON as secondary context. Applies only high-confidence identity corrections, preserves manual type overrides, raw records, prose and queue state. Updates current saved JSON/drafts/packets and live navigation without builds or fetching. Name sync may explicitly correct metadata on manual entries while retaining their wording. Returns unchanged with local validation reasons when identity/type is uncertain; unrelated rarity/prefix observations remain private context notes. Multiple exact title/body records can jointly corroborate identity/type. generated JSON alone cannot prove identity. Concurrent project writes are rejected while syncing."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target]
              properties:
                target: { type: string, enum: [type, name] }
      responses:
        "200":
          {
            description: "changed boolean and explanatory message; no build queued. Existing JSON metadata edits increment the item revision.",
          }
        "400": { description: Invalid request. }
        "404": { description: Unknown item. }
        "409":
          {
            description: "Busy worker, removed/retired entry, or metadata change cannot validate existing JSON.",
          }
  /api/items/{id}/duplicates:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    get:
      operationId: findPossibleReviewDuplicates
      description: Read-only lookup for active Needs review entries. Return up to 20 properly grouped candidates by names, aliases and extracted identity references with match reasons. Similarity is not proof of identical/obtainable items. No AI, fetching, merging, source transfer or project mutation.
      responses:
        "200":
          {
            description: "Original itemId, searched/total counts and possible matches.",
          }
        "400": { description: Item is not active in Needs review. }
        "404": { description: Unknown family. }
  /api/items/{id}/duplicates/remove:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: removeReviewDuplicateCandidate
      description: Reversibly remove only this Needs review entry using existing removal behavior. Recheck its group at mutation time, rejecting an item that has since been classified. No target ID, merging or evidence transfer. Matched items remain unchanged.
      requestBody:
        content:
          application/json:
            schema: { type: object, additionalProperties: false }
      responses:
        "200":
          { description: Review item removed; restorable from Removed items. }
        "409":
          {
            description: "Entry is no longer in Needs review or is currently processing.",
          }
        "404": { description: Unknown family. }
  /api/items/{id}/text-evidence:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: addManualTextEvidence
      description: Save a plain-text excerpt for this individual item, with an optional private display label. Text is stored verbatim except leading/trailing whitespace; HTML is never parsed or executed. Creates an independent manualText source record and local .txt snapshot. No URL, fetch, AI call or automatic build. Invalidate only the item's current analysis/draft; preserve last output, sibling items and run/checkpoints. Source enters the normal full-text reading/claims/validation and stats paths on the next requested build. Label is not factual proof. Local identifiers never become public acquisition URLs. Excerpts survive website refresh, fresh rebuilds, restart and generated-work reset. Remove/restore by sourceId uses existing source actions. Library retrieval uses only the owning item or explicitly applicable promoted shared scopes, never unrelated excerpts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                label: { type: string, maxLength: 160 }
                text: { type: string, minLength: 1, maxLength: 100000 }
      responses:
        "201":
          {
            description: Manual source record returned in source; no work started.,
          }
        "400":
          { description: "Invalid body, blank text or category/shared owner." }
        "404": { description: Unknown item. }
        "409":
          {
            description: Restore item or pause affected processing/metadata sync first.,
          }
  /api/items/{id}/text-evidence/{sourceId}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
      - { name: sourceId, in: path, required: true, schema: { type: string } }
    post:
      operationId: editManualTextEvidence
      description: Edit the label and plain text of an owned manual entry, including shared scopes. Keeps source ID, URL, binding, inclusion modes and output; replaces snapshot/hash and invalidates affected analysis for the next requested build. No AI, fetch or automatic queue changes. Inherited entries must be edited in their owning shared group. Reject removed entries and active affected consumers.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [text]
              properties:
                label: { type: string, maxLength: 160 }
                text: { type: string, minLength: 1, maxLength: 100000 }
      responses:
        "200": { description: Updated manual record returned in source. }
        "400": { description: Invalid or blank input. }
        "404":
          { description: Unknown owner or manual source not attached here. }
        "409":
          { description: Restore entry or pause affected processing first. }
  /api/items/{id}/shared-source-modes:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: setAllInheritedEvidenceModes
      description: Atomically apply Auto, Always include or Never include to every currently inherited reference on this individual item, including uncaptured sources. One invalidation, no AI, fetch or build. Retain outputs, shared indexes, sibling settings and queue/checkpoints. Never stays authoritative even if its binding later moves; blocked text and facts never reach first-read indexing, synthesis, sync or requested follow-ups. Auto selection is unchanged.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [mode]
              properties:
                mode: { type: string, enum: [auto, always, never] }
      responses:
        "200":
          description: Preferences saved; number of changed references returned. No work started.
          content:
            application/json:
              schema:
                type: object
                required: [ok, changed]
                properties:
                  ok: { type: boolean }
                  changed: { type: integer, minimum: 0 }
        "400":
          { description: Invalid mode/body or shared group instead of item. }
        "404": { description: Unknown item. }
        "409": { description: Restore item or pause affected processing first. }
  /api/items/{id}/evidence-request-notice/dismiss:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: dismissBlockedEvidenceRequestNotice
      description: Dismiss the current persistent blocked-evidence request alert by its exact id. Does not change source modes, drafts, status, output, queue or build checkpoint. A retry of the same request does not resurrect the notice; a new request may create a new alert. Alerts remain private and are excluded from AI prompts/public JSON. Matching excluded articles happens locally only after AI requests a topic; excluded text never leaves the app. Builds continue without waiting for approval.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [id]
              properties:
                id: { type: string, minLength: 1, maxLength: 100 }
      responses:
        "200": { description: Notice dismissal persisted. }
        "400": { description: Invalid body or shared group. }
        "404": { description: Unknown item. }
        "409": { description: Notice changed or metadata sync active. }
  /api/items/{id}/shared-source-mode:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string } }
    post:
      operationId: setItemSharedSourceMode
      description: Set per-item inclusion for an inherited URL. Auto (default) uses relevance selection; always sends all indexed facts without requiring them in final JSON; never excludes this inherited URL before item source fetching, classification, reading and writing. The reference remains visible and restorable through this mode selector; shared archives and sibling items remain intact. Setting a mode never fetches, invokes AI or appends queue work. Invalidates only this item's selected ledger/draft; retains output, shared indexes and other items' preferences. Canonical URL aliases share the preference, which survives restart and generated-work reset.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [url, mode]
              properties:
                url: { type: string, format: uri }
                mode: { type: string, enum: [auto, always, never] }
      responses:
        "200": { description: Preference saved; no build started. }
        "400":
          {
            description: Invalid request or category/shared owner instead of individual item.,
          }
        "404": { description: Unknown item or URL not inherited by it. }
        "409":
          {
            description: Restore excluded item or pause current affected processing first.,
          }
  /api/groups/run:
    post:
      operationId: startGroupBatch
      description: Start a batch of all active descendants matching this scope, ignoring sidebar filters. Rebuilds include completed children. Removed/retired entries are skipped. Uses the same ordered queue, run-size limit, pause/resume and failure continuation as global batches; scope and rebuild policy survive restart. Saved mode reuses captured sources and fetches only for children without any. Inherited evidence remains effective. URL-only mode preserves outputs and a paused build checkpoint. Does not create a shared-evidence owner.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, action]
              properties:
                scope:
                  type: object
                  required: [category]
                  properties:
                    category: { type: string }
                    group:
                      {
                        type: string,
                        description: Weapon type when category is Weapons.,
                      }
                    character:
                      { type: string, enum: [Roland, Lilith, Mordecai, Brick] }
                action:
                  {
                    type: string,
                    enum: [rebuild-saved, rebuild-fresh, discover],
                  }
      responses:
        "200":
          {
            description: Scoped run created; group rebuild includes completed entries exactly once.,
          }
        "400": { description: Invalid scope or action. }
        "409":
          {
            description: Pause active processing before starting another batch.,
          }
  /api/run:
    post:
      operationId: controlRun
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action:
                  {
                    type: string,
                    enum:
                      [start, pause, resume, discover, resume-build, cancel],
                  }
                sourceMode:
                  type: string
                  enum: [saved, fresh]
                  description: Only valid with start. Defaults to saved; reuse cached items and fetch sources for items with none. Fresh refreshes each unfinished item.
      responses:
        "200":
          {
            description: "Run state and per-item source initialization saved. Discover finds URLs for all active items including completed entries; it never fetches article HTML, reads source facts or builds JSON. Failed URL discovery is recorded separately and continues. A paused build checkpoint is retained for resume-build. Build runs skip completed/excluded items; pause/resume preserves sourceMode and checkpoints. Cancel clears the active/paused single-item or batch queue, deferred starts and saved build checkpoint, preserving captured sources, drafts, output, corrections, revisions and agent caches. Active cancellation sets cancelRequested while stopping the current agent process group; it does not fail over or add provider cooldowns, and finalizes idle after the step settles. In-flight HTTP work may finish before cancellation settles; no subsequent queue item starts. Cancellation survives interrupted service restart. Cancelled telemetry remains in History. Idle Resume is rejected; choose Start for a new run. Batch item failures are saved as blocked and processing continues; successful entries remain available. Single-item rebuilds stop on errors.",
          }
        "400": { description: "Invalid action or source mode." }
        "409":
          { description: "Pause an active run before starting another batch." }
  /api/coverage:
    post:
      operationId: scanCoverage
      responses:
        "200":
          {
            description: "Start an asynchronous cached inventory comparison; failures remain visible.",
          }
        "409": { description: "Another coverage scan is running." }
  /api/coverage/{key}:
    parameters:
      - { name: key, in: path, required: true, schema: { type: string } }
    post:
      operationId: correctCoverage
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [action]
              properties:
                action: { type: string, enum: [link, exclude] }
                familyId: { type: string }
      responses:
        "200":
          { description: Identity correction saved for future comparisons. }
        "400": { description: Invalid correction or missing family. }
        "404": { description: Coverage candidate or family missing. }
        "409": { description: Pause processing and wait for coverage first. }
  /api/settings:
    patch:
      operationId: updateSettings
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                agent: { type: string, enum: [grok, codex], default: grok }
                model:
                  {
                    type: string,
                    description: Optional Codex model override. Grok is pinned to grok-4.6.,
                  }
                writingStyle: { type: string }
                research: { type: boolean }
                maxItems: { type: integer, minimum: 1, maximum: 10000 }
      responses:
        "200":
          {
            description: "Saved settings. Agent preference may change during a call and applies to subsequent calls; it does not rebuild completed entries. Changed writing settings invalidate dependent work.",
          }
        "409": { description: "Pause first." }
  /api/agents:
    get:
      operationId: agentStatus
      responses:
        "200":
          {
            description: "Selected default, Grok/Codex subscription CLI statuses, recent failures, cooldowns and the five-minute per-provider call budget. Each provider is tried once; no third provider. No credentials exposed.",
          }
  /api/agents/recheck:
    post:
      operationId: recheckAgents
      responses:
        "200":
          {
            description: "Clear failure cooldowns and check CLI connections again. Does not start a model call or resume the queue.",
          }
  /api/codex:
    get:
      operationId: codexStatus
      responses:
        "200":
          {
            description: "Installed CLI/version and supported login status; no tokens exposed.",
          }
  /api/export:
    get:
      operationId: exportCatalogue
      responses:
        "200":
          {
            description: "Item-only website schema 7 ZIP: type-folder/slug.json, inline parts, grouped acquisition dropChances with player counts and conditions, contextual stats, omitted empty note strings; no sidecars or manifests.",
          }
        "409":
          {
            description: "No completed current-schema items, or missing part data.",
          }
  /api/reset:
    post:
      operationId: resetProject
      description: Requires explicit scope and RESET confirmation, with worker/coverage/metadata sync stopped. all recreates the project data directory and database, removes restored image-library and automatic recovery copies owned by this project, clears raw/artifact/source rows, settings, history and in-memory research/provider caches. Retains shipped/external image assets, app code, CLI accounts, extension preferences and user-exported backups outside the project. Browser clears its project layout and reloads. generated removes compiled entries, archived generated drafts/revisions, validation/retry/follow-up state, CLI response caches and internal exports; retains extracted data, archived/manual/shared evidence, research readings/indexes, exclusions/modes/removals, name/type/image corrections, historical statistics and manually edited JSON/dependencies. Both clear run/checkpoints and never start work.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [scope, confirmation]
              properties:
                scope: { type: string, enum: [generated, all] }
                confirmation: { type: string, enum: [RESET] }
      responses:
        "200":
          {
            description: "Reset completed. Generated reset retains captures, sources, corrections and manual output.",
          }
        "409": { description: "Pause the worker and coverage scan first." }

# Internal catalogue schema 5 is defined by src/shared/models.ts (Zod).
# Self-contained website schema 7 is defined by src/shared/website.ts.
# Entries carry compilerVersion, <=200-character summary, paragraph description,
# variants, contextual stats and references to shared part definitions.
# Website acquisition sources group conditional dropChances; null players means
# unspecified, never assumed solo. Nonempty optional notes are retained.
# Older outputs remain inspectable but are excluded from current-schema exports.
