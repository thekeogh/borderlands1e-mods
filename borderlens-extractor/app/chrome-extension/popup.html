<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Borderlens Page Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="mark">b.</span>
      <div><strong>Borderlens</strong><small>PAGE CAPTURE</small></div>
    </header>
    <main>
      <p class="eyebrow">SAVE THE ARTICLE YOU CAN SEE</p>
      <h1 id="title">Checking this page…</h1>
      <p id="message">Keep your local workshop open.</p>
      <button id="send" hidden>Send page to Borderlens</button
      ><button id="back" class="secondary">Open workshop</button>
      <p class="footnote">
        Captures article content only. No cookies, passwords or background wiki
        requests.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
