<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Borderlens Page Capture</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <span class="mark">b.</span>
      <div><strong>Borderlens</strong><small>PAGE CAPTURE</small></div>
    </header>
    <main>
      <p class="eyebrow">CHOOSE WHAT TO CAPTURE</p>
      <h1 id="title">Checking this page…</h1>
      <label class="close-tab-preference"
        ><input id="close-source-tab" type="checkbox" disabled /> Close source
        tab when returning after capture</label
      >
      <p id="message">Keep your local workshop open.</p>
      <button id="select" hidden>Select content on page</button>
      <button id="whole" class="secondary" hidden>Capture whole page</button>
      <button id="send" class="secondary" hidden disabled>
        Send selections to Borderlens</button
      ><button id="back" class="secondary">Open workshop</button>
      <p class="footnote">
        Captures article content only. No cookies, passwords or background wiki
        requests.
      </p>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
