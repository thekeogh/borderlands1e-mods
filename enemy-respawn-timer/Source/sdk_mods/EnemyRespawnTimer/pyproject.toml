[project]
name = "Enemy Respawn Timer"
version = "1.2.8"
authors = [{ name = "keogh" }]
description = """Choose how long cleared enemy groups wait before respawning.

1 minute (testing) / 30 minutes / 1 hour / 3 hours / Forever (until reload).
Default: 30 minutes. Timer starts after the last tracked enemy in a group dies.
Uses gameplay time; map reload clears timers. First spawns remain native.
Native proximity/mission rules still apply. Scripted/quest waves stay native.
F8: export respawn diagnostics (rebindable).
Enable before loading the map. Native den membership tracking.
Validated in selected BL1E encounters at 1 minute and Forever.
"""

[tool.sdkmod]
name = "Enemy Respawn Timer"
supported_games = ["BL1E"]
coop_support = "Unknown"
auto_enable = true
license = { name = "GPL3", url = "https://choosealicense.com/licenses/gpl-3.0/" }
